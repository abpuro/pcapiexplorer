name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PARTNER_CENTER_CLIENT_ID: ${{ vars.VITE_PARTNER_CENTER_CLIENT_ID }}
          VITE_PARTNER_CENTER_TENANT_ID: ${{ vars.VITE_PARTNER_CENTER_TENANT_ID || 'organizations' }}
          VITE_PARTNER_CENTER_SCOPE: ${{ vars.VITE_PARTNER_CENTER_SCOPE || 'https://api.partnercenter.microsoft.com/user_impersonation' }}
          VITE_PARTNER_CENTER_BASE_URL: ${{ vars.VITE_PARTNER_CENTER_BASE_URL || 'https://api.partnercenter.microsoft.com/v1' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
